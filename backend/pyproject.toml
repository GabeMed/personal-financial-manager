# Tooling config only; runtime dependencies are pinned in requirements.txt.
[tool.pytest.ini_options]
testpaths = ["tests"]
# The code imports itself as `backend.app...`, so the repository root must be
# importable.
pythonpath = [".."]
addopts = "-q"
filterwarnings = [
    # passlib 1.7.4 imports the stdlib `crypt` module; harmless on Python 3.12.
    "ignore:'crypt' is deprecated:DeprecationWarning",
]

[tool.ruff]
target-version = "py312"
line-length = 88
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency-injection markers are meant to be used as defaults.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query"]
