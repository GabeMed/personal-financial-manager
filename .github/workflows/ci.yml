name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend (ruff + pytest on ${{ matrix.database }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        database: [sqlite, postgres]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U test -d test"
          --health-interval 2s --health-timeout 3s --health-retries 30
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - name: pytest
        run: pytest
        env:
          TEST_DATABASE_URL: ${{ matrix.database == 'postgres' && 'postgresql+psycopg://test:test@localhost:5432/test' || 'sqlite://' }}

  frontend:
    name: Frontend (eslint + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/finance-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/finance-app/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  compose:
    name: docker compose smoke test
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - run: docker compose up --build --detach --wait
      - name: Log in as the demo user through the frontend's /api proxy
        run: |
          token=$(curl -sf -X POST http://localhost:5173/api/v1/auth/token \
            -d 'username=demo&password=demo1234' | jq -r .access_token)
          curl -sf http://localhost:5173/api/v1/transactions/summary \
            -H "Authorization: Bearer $token" | jq -e '.expense_total > 0'
          curl -sf http://localhost:5173/dashboard | grep -q '<title>Finance Manager</title>'
      - if: failure()
        run: docker compose logs
      - if: always()
        run: docker compose down --volumes
