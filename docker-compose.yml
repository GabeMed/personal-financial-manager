# docker compose up --build
#   App:      http://localhost:5173   (login: demo / demo1234)
#   API docs: http://localhost:8000/docs
services:
  db:
    image: postgres:16-alpine
    environment:
      # Local development credentials only.
      POSTGRES_USER: finance
      POSTGRES_PASSWORD: finance
      POSTGRES_DB: finance
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finance -d finance"]
      interval: 2s
      timeout: 3s
      retries: 30

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://finance:finance@db:5432/finance
      SECRET_KEY: ${SECRET_KEY:-local-dev-secret-change-me}
      CORS_ORIGINS: http://localhost:5173
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-true}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend/finance-app
    ports:
      - "5173:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  pgdata:
